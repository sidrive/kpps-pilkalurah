name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [claude/android-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # google-services.json dibutuhkan untuk Google Sign-In native.
      # Simpan isi file di secret GOOGLE_SERVICES_JSON (lihat ANDROID.md).
      - name: Tulis google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON kosong — APK jalan tapi login Google tidak akan berfungsi"
          fi
      - run: npm run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: kpps-pilkalurah-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
