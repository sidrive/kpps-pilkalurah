server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (Vue Router history mode) — wajib, kalau tidak refresh di /tally, /admin, dst 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA: file ini harus selalu di-revalidate supaya update app sampai ke device
    location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
